<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor Interactivo - PWA VR</title>
    <!-- Configuración PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#212121">
    <link rel="icon" type="image/png" href="assets/icon-192.png">

    <!-- Incluir A-Frame de forma local para acceso Offline -->
    <script src="js/aframe.min.js"></script>
    
    <!-- Incluir el script de interacciones -->
    <script src="js/app.js"></script>

    <!-- Registro del Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('Service Worker registrado con éxito.', reg))
            .catch(err => console.error('Error registrando el Service Worker', err));
        });
      }
    </script>
</head>
<body>
    <a-scene>
        <!-- 1. Manejador de Assets (Recursos) -->
        <a-assets>
            <!-- Imagen 360 equirectangular local -->
            <img id="bg-panorama" src="assets/city.jpg">
        </a-assets>

        <!-- 2. Entorno 360 -->
        <a-sky src="#bg-panorama"></a-sky>

        <!-- 3. Configuración de Cámara e Interacción por Mirada (Gaze) -->
        <a-entity position="0 1.6 0">
            <a-camera look-controls>
                <!-- El cursor funciona detectando la colisión del centro de la pantalla con objetos.
                     fuse="true" simula el clic al mantener la mirada.
                     fuseTimeout="1500" es el tiempo en milisegundos (1.5s) necesario para activar el clic.
                     raycaster="objects: .clickable" asegura que el cursor solo interactúe con elementos marcados.
                -->
                <a-entity cursor="fuse: true; fuseTimeout: 1500"
                          raycaster="objects: .clickable"
                          position="0 0 -1"
                          geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"
                          material="color: white; shader: flat; opacity: 0.8"
                          animation__fusing="property: scale; startEvents: fusing; easing: easeInCubic; dur: 1500; from: 1 1 1; to: 0.1 0.1 0.1"
                          animation__mouseleave="property: scale; startEvents: mouseleave; easing: easeInCubic; dur: 500; to: 1 1 1">
                </a-entity>
            </a-camera>
        </a-entity>

        <!-- 4. Puntos de Interés (Hotspots) -->

        <!-- Hotspot 1: Información de la arquitectura -->
        <!-- Lo rotamos un poco hacia el centro (0, 1.6, 0) para que el panel se vea de frente -->
        <a-entity position="-3 1.5 -4" rotation="0 35 0" hotspot-interaction>
            <!-- La esfera es el objeto "Clickable" que detecta la mirada -->
            <a-sphere class="clickable" radius="0.3" color="#FF5722" 
                      animation="property: position; dir: alternate; dur: 2000; easing: easeInOutSine; loop: true; to: 0 0.2 0"
                      animation__mouseenter="property: scale; to: 1.2 1.2 1.2; dur: 300; startEvents: mouseenter"
                      animation__mouseleave="property: scale; to: 1 1 1; dur: 300; startEvents: mouseleave">
            </a-sphere>
            
            <!-- Panel Informativo (Oculto por defecto con scale="0 0 0") -->
            <!-- Se mostrará arriba de la esfera -->
            <a-entity class="info-panel" position="0 1 0" scale="0 0 0"
                      animation__show="property: scale; to: 1 1 1; dur: 400; easing: easeOutElastic; startEvents: show"
                      animation__hide="property: scale; to: 0 0 0; dur: 300; startEvents: hide">
                <a-plane width="2.5" height="1.2" color="#212121" opacity="0.9" border-radius="0.1"></a-plane>
                <a-text value="Desarrollo Urbano\n\nEste panorama refleja la arquitectura\nmoderna y la iluminacion nocturna\nque caracteriza a las grandes urbes." 
                        align="center" position="0 0 0.05" width="2.2" color="#FFFFFF"></a-text>
            </a-entity>
        </a-entity>

        <!-- Hotspot 2: Información cultural o reflexión -->
        <a-entity position="3 1 -3" rotation="0 -45 0" hotspot-interaction>
            <a-sphere class="clickable" radius="0.3" color="#03A9F4" 
                      animation="property: position; dir: alternate; dur: 2500; easing: easeInOutSine; loop: true; to: 0 0.2 0"
                      animation__mouseenter="property: scale; to: 1.2 1.2 1.2; dur: 300; startEvents: mouseenter"
                      animation__mouseleave="property: scale; to: 1 1 1; dur: 300; startEvents: mouseleave">
            </a-sphere>
            
            <a-entity class="info-panel" position="0 1.2 0" scale="0 0 0"
                      animation__show="property: scale; to: 1 1 1; dur: 400; easing: easeOutElastic; startEvents: show"
                      animation__hide="property: scale; to: 0 0 0; dur: 300; startEvents: hide">
                <a-plane width="2.5" height="1.4" color="#1A237E" opacity="0.9"></a-plane>
                <a-text value="Reflexion Nocturna\n\nAl igual que en los relatos literarios,\nla noche en la ciudad guarda cientos\nde historias por descubrir detras de\ncada luz encendida." 
                        align="center" position="0 0 0.05" width="2.2" color="#FFFFFF"></a-text>
            </a-entity>
        </a-entity>

    </a-scene>
</body>
</html>
